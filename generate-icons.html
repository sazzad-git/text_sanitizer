<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Generator - Text Sanitizer Pro</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 40px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 20px;
    }
    .icon-container {
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .icon-item {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }
    .icon-item h3 {
      margin: 10px 0;
      color: #333;
    }
    canvas {
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      display: block;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }
    button:hover {
      background: #5568d3;
    }
    .instructions {
      background: white;
      padding: 20px;
      border-radius: 12px;
      max-width: 600px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .instructions h2 {
      color: #333;
      margin-bottom: 10px;
    }
    .instructions ol {
      color: #666;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h1>🎨 Text Sanitizer Pro - Icon Generator</h1>
  
  <div class="icon-container">
    <div class="icon-item">
      <h3>16x16</h3>
      <canvas id="icon16" width="16" height="16"></canvas>
      <button onclick="downloadIcon('icon16', 'icon16.png')">Download</button>
    </div>
    <div class="icon-item">
      <h3>48x48</h3>
      <canvas id="icon48" width="48" height="48"></canvas>
      <button onclick="downloadIcon('icon48', 'icon48.png')">Download</button>
    </div>
    <div class="icon-item">
      <h3>128x128</h3>
      <canvas id="icon128" width="128" height="128"></canvas>
      <button onclick="downloadIcon('icon128', 'icon128.png')">Download</button>
    </div>
  </div>

  <div class="instructions">
    <h2>Instructions:</h2>
    <ol>
      <li>Click each "Download" button to save the icons</li>
      <li>Save all three PNG files in your extension folder</li>
      <li>The icons will automatically be used by the extension</li>
    </ol>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const scale = size / 128; // Base design is for 128x128
      
      // Clear canvas
      ctx.clearRect(0, 0, size, size);
      
      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // Rounded corners effect
      ctx.globalCompositeOperation = 'destination-in';
      ctx.beginPath();
      const radius = size * 0.2;
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      
      // Draw shield/checkmark icon (sanitizer theme)
      ctx.strokeStyle = 'white';
      ctx.fillStyle = 'white';
      ctx.lineWidth = size * 0.08;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      
      // Shield shape
      const centerX = size / 2;
      const centerY = size / 2;
      const shieldWidth = size * 0.5;
      const shieldHeight = size * 0.6;
      
      ctx.beginPath();
      ctx.moveTo(centerX, centerY - shieldHeight / 2);
      ctx.lineTo(centerX + shieldWidth / 2, centerY - shieldHeight / 4);
      ctx.lineTo(centerX + shieldWidth / 2, centerY + shieldHeight / 4);
      ctx.lineTo(centerX, centerY + shieldHeight / 2);
      ctx.lineTo(centerX - shieldWidth / 2, centerY + shieldHeight / 4);
      ctx.lineTo(centerX - shieldWidth / 2, centerY - shieldHeight / 4);
      ctx.closePath();
      ctx.stroke();
      
      // Checkmark inside shield
      ctx.lineWidth = size * 0.06;
      ctx.beginPath();
      ctx.moveTo(centerX - shieldWidth * 0.15, centerY);
      ctx.lineTo(centerX - shieldWidth * 0.05, centerY + shieldHeight * 0.15);
      ctx.lineTo(centerX + shieldWidth * 0.2, centerY - shieldHeight * 0.1);
      ctx.stroke();
      
      // Text "TSP" letters (only for larger sizes)
      if (size >= 48) {
        ctx.font = `bold ${size * 0.18}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillText('TSP', centerX, centerY + shieldHeight * 0.35);
      }
    }
    
    // Polyfill for roundRect if not available
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
        this.beginPath();
        this.moveTo(x + radius, y);
        this.lineTo(x + width - radius, y);
        this.quadraticCurveTo(x + width, y, x + width, y + radius);
        this.lineTo(x + width, y + height - radius);
        this.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        this.lineTo(x + radius, y + height);
        this.quadraticCurveTo(x, y + height, x, y + height - radius);
        this.lineTo(x, y + radius);
        this.quadraticCurveTo(x, y, x + radius, y);
        this.closePath();
      };
    }
    
    function downloadIcon(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
    
    // Generate all icons on load
    window.onload = function() {
      drawIcon(document.getElementById('icon16'), 16);
      drawIcon(document.getElementById('icon48'), 48);
      drawIcon(document.getElementById('icon128'), 128);
    };
  </script>
</body>
</html>
